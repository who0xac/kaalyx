[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaalyx"
version = "1.2.0"
description = "Automated bug-bounty reconnaissance & vulnerability-discovery pipeline (orchestrator for 40+ recon/vuln CLI tools)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "who0xac" }]
keywords = ["recon", "bug-bounty", "osint", "security", "pentest", "orchestrator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]

# Runtime dependencies (the Python packages Kaalyx itself imports — NOT the external
# recon/vuln CLI tools, which are installed separately via scripts/install.sh).
dependencies = [
    "rich>=13.7,<14",
    "typer>=0.12,<1.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1.0",
    "mmh3>=4.0,<6.0",
]

[project.urls]
Homepage = "https://github.com/who0xac/kaalyx"
Repository = "https://github.com/who0xac/kaalyx"

# The console command created on install. `pipx install .` puts `kaalyx` on PATH.
# `kaalyx.cli:app` is the Typer application object, which is callable.
[project.scripts]
kaalyx = "kaalyx.cli:run"

[tool.setuptools]
# Flat layout: the `kaalyx` package sits at the repository root.
packages = [
    "kaalyx",
    "kaalyx.core",
    "kaalyx.data",
    "kaalyx.stages",
    "kaalyx.parsers",
    "kaalyx.notify",
    "kaalyx.monitor",
    "kaalyx.ui",
]

# NOTE: config.yaml is intentionally NOT packaged. kaalyx/config.py falls back to
# built-in dataclass defaults when no ./config.yaml is present, so a pipx-installed
# Kaalyx runs correctly outside the source tree; a local ./config.yaml still overrides.
